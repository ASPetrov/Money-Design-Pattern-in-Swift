only_rules:
  - file_length
  - function_body_length
  - identifier_name
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - custom_rules

file_length:
  warning: 400
  error: 400
  ignore_comment_only_lines: false

function_body_length:
  warning: 20
  error: 50

identifier_name:
  min_length: 0
  max_length:
    warning: 20
    error: 40
  # Published arithmetic and conversion errors. Anchors keep renames subject to the 40-character limit.
  excluded:
    - '^unrepresentableResult$'
    - '^invalidRecipientCount$'
    - '^totalWeightOutOfRange$'
    - '^incompatibleCurrencies$'
    - '^incompatibleCurrencyScale$'
  validates_start_with_lowercase: error

force_try: error
force_unwrapping: error

implicitly_unwrapped_optional:
  severity: error
  mode: all

custom_rules:
  optional_try:
    regex: '\b(try)\?'
    capture_group: 1
    match_kinds: keyword
    message: Handle the thrown error explicitly.
    severity: error

  function_name_length:
    regex: '\bfunc\s+`?([\p{L}_][\p{L}\p{M}\p{N}_]{40,})`?\s*(?=[<(])'
    capture_group: 1
    match_kinds: [keyword, identifier]
    message: Keep function names at 40 characters or fewer.
    severity: error
